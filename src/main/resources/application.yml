server:
  port: ${PORT:5000}

spring:
  profiles:
    default: local
  application:
    name: proflow-server

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${EMAIL_USER:}
    password: ${EMAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

  ai:
    openai:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      api-key: ${GEMINI_API_KEY:}
      chat:
        options:
          model: ${GEMINI_MODEL:gemini-1.5-flash}
          temperature: 0.3

# ProFlow Custom Application Settings
app:
  jwt:
    # Set JWT_SECRET to a randomly generated Base64 key of at least 32 bytes.
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours
  client:
    url: ${CLIENT_URL:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  zoom:
    account-id: ${ZOOM_ACCOUNT_ID:}
    client-id: ${ZOOM_CLIENT_ID:}
    client-secret: ${ZOOM_CLIENT_SECRET:}
    host-email: ${ZOOM_HOST_EMAIL:}

# Swagger / OpenAPI UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
