server:
  port: 5000

spring:
  application:
    name: proflow-server

  datasource:
    url: jdbc:postgresql://localhost:5432/proflow
    username: postgres
    password: Jagan985
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  mail:
    host: ${ZOHO_SMTP_HOST:smtp.zoho.in}
    port: ${ZOHO_SMTP_PORT:465}
    username: ${EMAIL_USER:notifications@proflows.in}
    password: ${EMAIL_PASS:Y9Jfge517WHJ}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.zoho.in
          starttls:
            enable: false

